# CI: lint + 경량 테스트(unit·contracts), DB·Redis·LLM 불필요
# develop·main 대상 PR과 push에서 실행, 통합·e2e는 서비스 필요해 별도 도입 예정
name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

# 같은 브랜치 중복 실행 취소로 러너 절약
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # alembic도 실행되는 코드라 검사 대상 포함, pre-commit 훅 적용 범위와 일치
      - name: Ruff lint
        run: uv run ruff check src tests alembic

      - name: Ruff format check
        run: uv run ruff format --check src tests alembic

  test:
    name: Test (unit·contracts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # llm 마커는 pyproject의 addopts에서 기본 제외되어 실 LLM 호출·API 키 불필요
      - name: Run tests
        run: uv run pytest tests/unit tests/contracts
