# Etching SOP(MAN-ETC-042) 기반 매뉴얼 검색 골든 질의 셋 (AI_RAG02_EVAL01)
# 근거 문서: data/manuals/Etching_Equipment_SOP_v1_6.pdf (EQP-ETCH-SOP-001 Rev 1.6)
# GOLDEN-002~006 난이도 쉬움(사실 확인형), GOLDEN-007~011 난이도 중간(절차 분기·연결형)
# GOLDEN-012 무근거 정직 보고 검증(네거티브), rag_hit_docs 없어 검색 평가 대상에서 제외
# 대표 시나리오 GOLDEN-001은 scenario_err402.yaml에 위치
#
# 주의: E2E(-m llm)의 tools_called_any 검증은 e2e conftest의 knowledge 도구 배선 선행 필요
# TODO(김건) e2e knowledge in-process 도구 배선은 하네스 담당자와 공동 진행 (TEST_HARNESS)
# TODO(김건) 적재 문서 1개 상태에서는 hit@k 변별력 낮음, 문서 추가 후 청크 단위 기준 검토 (AI_RAG02_EVAL01)
# TODO(김건) answer_contains_any는 하나만 포함돼도 통과, 복수 요구 검증은 answer_contains_all류 추가 필요

- id: GOLDEN-002
  title: ERR-402 알람 의미와 대표 텔레메트리 패턴 (근거 p.7)
  query: "ERR-402 알람은 어떤 고장을 의미하고, 대표적인 텔레메트리 패턴이 뭐야?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["냉각 시스템", "온도 상승", "압력 하강"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-003
  title: SOP가 다루는 텔레메트리 변수 4가지 (근거 p.1, p.2)
  query: "이 식각 장비 SOP가 다루는 텔레메트리 변수 4가지가 뭐야?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["gas_flow", "rf_power"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-004
  title: 알람 우선순위 1순위와 이유 (근거 p.5)
  query: "알람 우선순위에서 1순위 알람이 뭐고 왜 1순위야?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["ERR-402"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-005
  title: WRN-501 경고 의미와 관련 변수 (근거 p.11, p.20)
  query: "WRN-501 알람은 무엇을 경고하는 거고 관련 변수는 뭐야?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["가스 유량", "gas_flow"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-006
  title: ERR-201 가능 원인 2가지 이상 (근거 p.10)
  query: "ERR-201 RF 파워 이상 알람의 가능한 원인들을 알려줘"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["매칭 네트워크", "RF 제너레이터", "케이블"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-007
  title: ERR-401 최우선 확인 항목과 ERR-402 분기 (근거 p.8)
  query: "ERR-401 온도 이탈 알람이 떴을 때 가장 먼저 뭘 확인해야 하고, 결과에 따라 어떻게 대응이 달라져?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["ERR-402", "압력"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-008
  title: RF 단발 스파이크 시 공정 중지 판단 (근거 p.10)
  query: "RF 전력이 순간적으로 한 번 튀었는데 바로 공정을 중지해야 해? SOP 기준으로 알려줘"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["연속", "스파이크", "지속"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-009
  title: WRN-702 방치 시 격상 알람과 예방 조치 (근거 p.13)
  query: "압력 드리프트 경고를 방치하면 어떤 알람으로 악화되고, 그 전에 뭘 해야 해?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["ERR-301", "PM"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-010
  title: 총 유량만으로 개별 가스라인 고장 판단 금지 (근거 p.5, p.11, p.15)
  query: "총 가스 유량이 낮게 나오면 특정 가스 라인 고장이라고 바로 판단해도 돼?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["현장 점검", "MFC", "총 유량"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

- id: GOLDEN-011
  title: ERR-901 다변량 이상의 차별화된 대응 절차 (근거 p.17)
  query: "ERR-901 다변량 이상 알람은 다른 ERR 알람들과 대응 방식이 어떻게 달라?"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["엔지니어링 리뷰", "백업", "단일 부품"]
    citations_include: [MAN-ETC-042]
    rag_hit_docs: [MAN-ETC-042]

# 무근거 정직 보고 케이스: SOP에 없는 알람, 지어내지 않고 근거 부족 보고 검증 (BE_MCP04_RAG01)
- id: GOLDEN-012
  title: 매뉴얼에 없는 알람 무근거 정직 보고 (ERR-999)
  query: "ERR-999 알람의 원인과 조치 방법을 매뉴얼에서 찾아줘"
  expect:
    tools_called_any: [search_manuals]
    answer_contains_any: ["없", "확인되지 않", "찾을 수 없", "부족"]
