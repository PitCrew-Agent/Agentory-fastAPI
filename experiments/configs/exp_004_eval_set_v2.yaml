    - {equipment_id: SYN-O01, process_type: EtchingCoupled, scenario: osc_propagation, generator: synthetic}
    - {equipment_id: SYN-O02, process_type: EtchingCoupled, scenario: osc_propagation, generator: synthetic}
    - {equipment_id: SYN-L01, process_type: EtchingCoupled, scenario: inband_drift, generator: synthetic}
    - {equipment_id: SYN-L02, process_type: EtchingCoupled, scenario: inband_drift, generator: synthetic}
    - {equipment_id: SYN-I01, process_type: EtchingCoupled, scenario: ignition, generator: synthetic}
