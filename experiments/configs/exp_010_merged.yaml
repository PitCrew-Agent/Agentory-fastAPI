# EXP-010 재구성 + VAR 병합 경로 (서빙 통합 검증)
# 두 경로를 OR 병합, 나머지 파라미터는 EXP-007 확정값 고정
name: EXP-010-MERGED
method: merged_paths
eval_set: data/eval/v2
window: 12
stride: 6
n_components: 0.9
threshold_quantile: 0.999
cross_correlation: true
ewma_alpha: 0.1
ewma_clip: 3.0
confirm_k: 2
max_delay_ticks: 180
transition_threshold: 1000.0
transition_settle: 10
var_lag: 2
