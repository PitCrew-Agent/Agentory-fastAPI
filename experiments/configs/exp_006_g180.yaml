# EXP-006 동일 설정, 감지 유예 180 tick(15분) 채점
# corr_break류 완만 전개 이상의 운영 요구에 맞춘 유예, EWMA 시정수(약 120 tick) 반영
# 유예 60 결과(exp_006)와 병행 보고, 급성 계열 비교는 유예 60 기준 유지
name: EXP-006-G180
method: pca_mspc
eval_set: data/eval/v2
window: 24
stride: 12
n_components: 0.9
threshold_quantile: 0.999
cross_correlation: true
ewma_alpha: 0.1
ewma_clip: 3.0
max_delay_ticks: 180
