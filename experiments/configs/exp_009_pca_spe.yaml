# EXP-009 검출기 계열 비교, SPE 단독 (기여 분해)
# 파라미터·후처리는 EXP-007 확정값 고정, 검출기만 교체해 동일 지표로 비교
name: EXP-009-SPE
method: pca_mspc
eval_set: data/eval/v2
window: 12
stride: 6
n_components: 0.9
threshold_quantile: 0.999
cross_correlation: true
ewma_alpha: 0.1
ewma_clip: 3.0
confirm_k: 2
max_delay_ticks:
  _default: 180
  drift_inband: 720  # 완만 드리프트는 15분 내 SNR<0.6, 물리적 감지 한계 반영
transition_threshold: 1000.0
transition_settle: 10
statistic: spe
