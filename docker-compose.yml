# 로컬 개발 스택 (INFRA01_DOCKER01)
# TODO(안민호): 배포용 구성 확장
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: agentory
      POSTGRES_PASSWORD: agentory
      POSTGRES_DB: agentory
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentory"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentory:agentory@db:5432/agentory
      REDIS_URL: redis://redis:6379/0
      MCP_REALTIME_URL: http://mcp-realtime:8101/mcp
      MCP_KNOWLEDGE_URL: http://mcp-knowledge:8102/mcp
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mcp-realtime:
    build: .
    command: ["mcp-realtime"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentory:agentory@db:5432/agentory
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8101:8101"
    depends_on:
      db:
        condition: service_healthy

  mcp-knowledge:
    build: .
    command: ["mcp-knowledge"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentory:agentory@db:5432/agentory
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8102:8102"
    depends_on:
      db:
        condition: service_healthy

  simulator:
    build: .
    command: ["simulator"]  # 기본 normal 시나리오, 5초 주기 무한 적재
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://agentory:agentory@db:5432/agentory
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped  # equipment_master 시드 전이면 대기 후 자동 적재

  # TODO(안민호): Keycloak (IdP) 구성 (BE_AUTH01_OAUTH01)
  # keycloak:
  #   image: quay.io/keycloak/keycloak:26.0
  #   command: ["start-dev"]
  #   environment:
  #     KC_BOOTSTRAP_ADMIN_USERNAME: admin
  #     KC_BOOTSTRAP_ADMIN_PASSWORD: admin
  #   ports:
  #     - "8080:8080"

volumes:
  pgdata:
  redisdata:
